<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1e2a" />
    <title>Everenfell</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06121b; overflow: hidden; }
      #sitebar { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 5;
        display: flex; align-items: center; gap: 18px; padding: 0 16px;
        border-bottom: 1px solid #96c3d729; background: #06121bef;
        font-family: system-ui, sans-serif; font-size: 13px; color: #b6c7cd; }
      #sitebar a { color: inherit; text-decoration: none; }
      #sitebar a:hover { color: #f6d16b; }
      #sitebar .brand { font-weight: 800; letter-spacing: .1em; white-space: nowrap; }
      #sitebar .brand b { color: #f1c25b; }
      #sitebar-account { margin-left: auto; white-space: nowrap; }
      #sitebar-mute { background: none; border: 1px solid #96c3d729; border-radius: 6px;
        color: #b6c7cd; font-size: 14px; line-height: 1; padding: 4px 8px; cursor: pointer; }
      #sitebar-mute:hover { color: #f6d16b; border-color: #f6d16b66; }
      #sitebar-mute[aria-pressed="true"] { opacity: 0.55; }
      #app { position: fixed; inset: 44px 0 0 0; }
      #app canvas { display: block; }
      #ui { position: fixed; inset: 44px 0 0 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      /* DOM panels dock bottom-left so they never cover game art. */
      #ui .ev-view { position: absolute; left: 12px; bottom: 12px; max-width: 340px;
        background: #000000d9; border: 1px solid #96c3d729; border-radius: 8px;
        padding: 10px 12px; margin: 0; }
      #ui .ev-view h1 { font-size: 15px; margin: 0 0 6px; }
      #ui .ev-view p { font-size: 12px; margin: 6px 0; }
      #ui .ev-status { position: absolute; top: 8px; left: 12px; margin: 0;
        font-size: 12px; color: #8a97a3; }
    </style>
  </head>
  <body>
    <header id="sitebar">
      <a class="brand" href="/"><b>AGP</b> STUDIOS</a>
      <a href="/">Home</a>
      <button id="sitebar-mute" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
      <span id="sitebar-account"><a href="/auth/login">Sign in</a></span>
    </header>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
