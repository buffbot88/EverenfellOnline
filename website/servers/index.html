<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06121b">
  <title>Play Everenfell — Choose a Server</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#f2f6f7;background:#06121b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 75% 15%,#173f47 0,transparent 42%),linear-gradient(145deg,#06121b,#0b1e2a)}a{color:inherit;text-decoration:none}.card{width:min(100%,540px);padding:clamp(28px,7vw,52px);border:1px solid #96c3d72e;border-radius:18px;background:#0b1e2acc;box-shadow:0 24px 80px #0005;text-align:center}.brand{color:#f1c25b;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.card h1{margin:14px 0;font-size:clamp(30px,7vw,44px)}.card p{color:#b6c7cd;line-height:1.6}.server{display:block;margin-top:24px;padding:18px;border:1px solid #f1c25b80;border-radius:12px;background:#102632;text-align:left}.server[hidden]{display:none}.server strong{display:block;font-size:20px}.server span{display:block;margin-top:5px;color:#b6c7cd;font-size:14px}.server:hover,.server:focus-visible{border-color:#f6d16b;outline:2px solid #f6d16b;outline-offset:2px}.message{min-height:24px;margin-top:20px;color:#b6c7cd}.back{display:inline-block;margin-top:18px;color:#f1c25b;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Everenfell</div>
    <h1>Choose a server</h1>
    <p id="intro">Checking your AGP Studios account…</p>
    <a id="s1" class="server" href="/websites/everenfell/?server=S1" hidden>
      <strong>S1</strong><span>Enter Everenfell</span>
    </a>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <a class="back" href="/">← Back to Everenfell</a>
  </main>
  <script src="/access.js"></script>
  <script>
    const intro = document.querySelector('#intro');
    const message = document.querySelector('#message');
    window.EverenfellAccess.session().then((user) => {
      if (window.EverenfellAccess.canPlay(user)) {
        intro.textContent = 'Select a server to launch the game client.';
        document.querySelector('#s1').hidden = false;
      } else if (user) {
        intro.textContent = 'You are signed in.';
        message.textContent = 'Everenfell is under maintenance; only admins can play right now.';
      } else {
        intro.textContent = 'Sign in with your AGP Studios account to continue.';
        const signIn = document.createElement('a');
        signIn.className = 'back';
        signIn.href = 'https://www.agpstudios.org/';
        signIn.textContent = 'Sign in at AGP Studios';
        message.appendChild(signIn);
      }
    }).catch(() => {
      intro.textContent = 'Your account could not be checked.';
      message.textContent = 'Please try again later.';
    });
  </script>
</body>
</html>
